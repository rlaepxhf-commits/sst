<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SST 스마트 쌤들의 툴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* 레이아웃: 검정 바탕. 처음엔 비어 있고, 선생님이 담은 메뉴만 둥근 색 상자로 화면을 나눠 채운다. Store와 도구는 가운데 팝업 */
:root{
  --bg:#050506; --surface:#111113; --surface-2:#1a1a1e; --line:#2a2a30; --line-soft:rgba(255,255,255,.12);
  --fg:#f4f4f6; --fg-2:#d9d9df; --muted:#8e8e99; --dim:#5c5c66; --ink-on-color:#ffffff; --qr-light:#ffffff;
  /* 주제 4가지: 파랑 · 주황 · 보라 · 청록 */
  --econ:#ff5a0a; --lesson:#2a22ff; --done:#7a2cf0; --mind:#1ec4cf;
  --econ-bg:var(--econ); --lesson-bg:var(--lesson); --done-bg:var(--done); --mind-bg:linear-gradient(170deg,#25dcd2,#2aa3d8);
  --hot:#ff2fd0; --violet:#7a2cf0;
  --grad:linear-gradient(90deg,#ff7a3d,#c04dff 55%,#7a6cff);
  --scrim:rgba(0,0,0,.72); --shade:rgba(0,0,0,.66);
  --good:#2fd27a; --warn:#ffc21a; --bad:#ff4b4b;
  --f-body:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:anywhere;font-feature-settings:"ss01","cv11"}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
svg.lucide{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* 위쪽 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
.bar .sp{flex:1}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo b{font-family:"Inter",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.05em;white-space:nowrap}
.logo small{color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.tag{font-size:10.5px;font-weight:600;color:var(--fg-2);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.clschip{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clschip b{color:var(--fg);font-weight:600}
.navlink{background:none;border:0;color:var(--fg-2);font-size:14px;font-weight:500;cursor:pointer;padding:10px 12px;border-radius:999px}
.navlink:hover{color:var(--fg);background:var(--surface)}

/* 단추 */
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:17px;height:17px}
.btn.white{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.white:hover{background:#fff}
.btn.grad{background:var(--grad);border:0;color:var(--ink-on-color)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface)}
.btn.big{min-height:52px;padding:0 26px;font-size:15px}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.glass{background:rgba(255,255,255,.04);border-color:var(--line-soft);backdrop-filter:blur(10px)}
.btn.glass:hover{background:rgba(255,255,255,.09)}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;flex:none}

/* 첫 화면 */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding-block:6vh 9vh;position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;inset:8% 0 0;z-index:-1;pointer-events:none;opacity:.5;filter:blur(70px);
  background:radial-gradient(28% 36% at 28% 62%,rgba(255,90,10,.35),transparent 70%),radial-gradient(26% 34% at 52% 70%,rgba(122,44,240,.45),transparent 70%),radial-gradient(24% 30% at 74% 60%,rgba(42,34,255,.4),transparent 70%),radial-gradient(20% 26% at 62% 82%,rgba(30,196,207,.3),transparent 70%)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:0;font-weight:300;font-size:clamp(30px,5vw,64px);line-height:1.22;letter-spacing:-.045em;text-wrap:balance;max-width:16.5em}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.hero .sub{margin:0;color:var(--muted);font-size:15.5px;font-weight:400;max-width:30em;text-wrap:balance;line-height:1.65}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cta .btn.white{box-shadow:0 10px 30px rgba(255,255,255,.12)}
.cta .btn svg{width:16px;height:16px;transition:transform .2s}
.cta .btn:hover svg{transform:translateX(3px)}
.themes{display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center;list-style:none;margin:6px 0 0;padding:0}
.themes li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
.themes li i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.foot{padding-block:18px;color:var(--dim);font-size:12px;text-align:center}

/* 처음 설정 */
.ob{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-block:4vh 8vh}
.card{width:100%;max-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:22px;align-content:start}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stepper div{display:grid;gap:8px;font-size:12px;font-weight:500;color:var(--dim)}
.stepper div::before{content:"";height:3px;border-radius:3px;background:var(--line)}
.stepper .on{color:var(--fg)}
.stepper .on::before{background:var(--grad)}
.card h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.035em;text-wrap:balance;line-height:1.35}
.card .lead{margin:-12px 0 0;color:var(--muted)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
input,select,textarea{width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font:15px/1.5 var(--f-body);letter-spacing:-.01em;min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#55555f}
textarea{min-height:120px;resize:vertical}
#roster{min-height:200px}
input::placeholder,textarea::placeholder{color:var(--dim)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--violet)}
.check small{display:block;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;white-space:nowrap}
.chip em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
.note{font-size:12.5px;color:var(--dim)}

/* 학생 초대 */
.invite{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:var(--surface-2);border-radius:18px;padding:18px}
.qr{width:148px;height:148px;background:var(--qr-light);border-radius:14px;padding:10px;box-sizing:content-box;display:grid;place-items:center;color:var(--bg);font-size:12px;text-align:center}
.qr img,.qr canvas{display:block}
.url{font:600 clamp(18px,3vw,24px) var(--f-mono);word-break:break-all;margin:4px 0 10px;letter-spacing:-.02em}
.howto{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.howto li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;counter-increment:s}
.howto li::before{content:counter(s);width:30px;height:30px;border-radius:50%;border:1px solid var(--line-soft);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--fg)}
.howto b{display:block;font-weight:600}
.howto span{color:var(--muted);font-size:14px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pin{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pin .who{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .who em{font-style:normal;color:var(--fg);margin-right:4px}
.pin .code{font:600 20px var(--f-mono);letter-spacing:.12em}

/* 내 학급: 담은 메뉴만으로 채우는 상자 */
.stage{flex:1;padding-block:8px 20px;display:flex;flex-direction:column}
.inner{max-width:1320px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:40px}
.toolbar h2{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.toolbar h2 b{color:var(--fg);font-weight:600}
.toolbar .sp{flex:1}
.map{position:relative;width:100%}
.tile{position:absolute;box-sizing:border-box;border-radius:26px;padding:18px 20px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 55%),var(--c);color:var(--ink-on-color);cursor:pointer;overflow:hidden;transition:filter .2s,transform .2s;display:flex;flex-direction:column;justify-content:flex-end}
.tile:hover{filter:brightness(1.08)}
.tile:active{transform:scale(.988)}
.tile .cat{position:absolute;left:20px;top:17px;font-size:11.5px;font-weight:600;letter-spacing:.01em;opacity:.78}
.tile .nm{font-weight:700;letter-spacing:-.04em;line-height:1.12;position:relative}
.tile .ds{font-size:13px;font-weight:400;opacity:.8;margin-top:6px;line-height:1.45;max-width:22em;position:relative;letter-spacing:-.015em}
.tile .ico{position:absolute;right:20px;top:18px;color:var(--ink-on-color);pointer-events:none;opacity:.96}
.tile .ico svg{width:var(--is);height:var(--is);stroke-width:var(--sw)}
.tile.xl .nm{font-size:clamp(30px,3.2vw,44px)}
.tile.lg .nm{font-size:25px}
.tile.md .nm{font-size:18px}
.tile.sm{border-radius:18px;padding:12px 14px}
.tile.sm .nm{font-size:14px;letter-spacing:-.03em}
.tile.sm .cat{display:none}
.tile.sm .ico{right:12px;top:11px}
.tile .only{position:absolute;left:20px;top:38px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.2);padding:1px 8px;border-radius:999px}
.tile.new{animation:pop .5s ease both}
@keyframes pop{from{filter:brightness(1.6);transform:scale(.94)}to{filter:none;transform:none}}
.ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:5px;z-index:1}
.ctl button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.42);color:var(--ink-on-color);cursor:pointer;display:grid;place-items:center}
.ctl button svg{width:16px;height:16px}
.ctl button:disabled{opacity:.3;cursor:default}
.edit .tile{cursor:default;outline:1.5px dashed rgba(255,255,255,.6);outline-offset:-8px}
.blank{flex:1;min-height:60vh;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:28px}
.blank div{display:grid;gap:12px;justify-items:center;max-width:24em;padding:24px}
.blank p{margin:0;color:var(--dim);font-size:14px}
.banner{background:var(--grad);color:var(--ink-on-color);font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:8px}
.banner button{background:rgba(0,0,0,.25);border:0;border-radius:999px;padding:4px 12px;color:var(--ink-on-color);font-weight:600;cursor:pointer}
.demo{display:flex;gap:8px 16px;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:9px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.demo b{color:var(--fg);font-weight:600}
.demo-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* 팝업 공통 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:19;backdrop-filter:blur(4px)}
.scrim.anim{animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.modal{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-sizing:border-box;display:grid;gap:16px}
.modal.anim{animation:rise .22s ease both}
.modal.wide{width:min(720px,calc(100% - 32px))}
@keyframes rise{from{opacity:0;transform:translate(-50%,-47%)}}
.modal h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.035em}
.modal .lead{margin:-8px 0 0;color:var(--muted);font-size:14px}
.hint{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.hint b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.menu{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:220px;display:grid;animation:fade .15s ease both}
.menu button{background:none;border:0;text-align:left;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--surface)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .who{padding:8px 14px 10px;font-size:12px;color:var(--muted)}
.menu .who b{display:block;color:var(--fg);font-size:14px;font-weight:600}

/* SST Store 팝업 */
.storebox{width:min(980px,calc(100% - 32px));height:min(760px,calc(100% - 40px));padding:0;gap:0;grid-template-rows:auto 1fr auto;overflow:hidden}
.sh{padding:22px 24px 14px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.sh .top{display:flex;align-items:center;gap:10px}
.sh h3{font-family:"Inter",sans-serif;font-size:24px;font-weight:800;letter-spacing:-.045em;flex:1}
.sh p{margin:0;color:var(--muted);font-size:13.5px}
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.stabs button i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.stabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sl{overflow:auto;padding:16px 24px 24px;display:grid;gap:10px;align-content:start}
.ssec{font-size:13px;font-weight:600;color:var(--fg-2);margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.ssec:first-child{margin-top:0}
.ssec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.ssec small{color:var(--dim);font-weight:500}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto auto;gap:4px 14px;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid transparent;align-items:start}
.item.in{border-color:color-mix(in srgb,var(--cs) 70%,white 10%)}
.item .sq{grid-row:1/3;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color)}
.item .sq svg{width:24px;height:24px;stroke-width:1.75}
.item .nm{font-weight:600;font-size:15px;letter-spacing:-.025em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .nm small{font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.item .ds{color:var(--muted);font-size:13px;line-height:1.5}
.item .act{grid-column:2;display:flex;justify-content:flex-end;margin-top:6px}
.sf{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sf span{flex:1;color:var(--muted);font-size:13px}

/* 도구 팝업 */
.toolbox{width:min(1000px,calc(100% - 32px));height:min(780px,calc(100% - 40px));padding:0;gap:0;grid-template-rows:auto 1fr auto;overflow:hidden}
.th{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.th .sq{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:var(--ink-on-color);flex:none}
.th .sq svg{width:22px;height:22px;stroke-width:1.75}
.th .t{flex:1;min-width:120px}
.th .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.th .t b{font-size:19px;font-weight:700;letter-spacing:-.04em}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{min-height:34px;padding:0 14px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--fg);color:var(--bg)}
.same{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.same svg{width:16px;height:16px;color:var(--good)}
.tb{overflow:auto;padding:22px 24px;display:grid;gap:14px;align-content:start}
.tf{padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.lockmsg{display:grid;justify-items:center;text-align:center;gap:10px;padding:56px 16px;color:var(--muted)}
.lockmsg svg{width:40px;height:40px;stroke-width:1.5;color:var(--fg-2)}
.lockmsg b{color:var(--fg);font-size:18px;font-weight:700;letter-spacing:-.03em}

/* 도구 속 공통 부품 */
.ap{display:grid;gap:16px;align-content:start}
.qbig{font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-.04em;line-height:1.3;text-align:center;text-wrap:balance}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.grow{flex:1;min-width:0}
.mute{color:var(--muted);font-size:13.5px}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox div,.ox button{border-radius:22px;padding:22px;text-align:center;background:var(--surface-2);border:1.5px solid var(--line);color:inherit}
.ox button{cursor:pointer}
.ox b{display:block;font:300 clamp(56px,10vw,110px)/1 "Inter",sans-serif;letter-spacing:-.04em}
.ox span{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ox .win{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface-2))}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(80px,180px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.barrow .tr{height:26px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.barrow .fl{height:100%;background:var(--cs);border-radius:8px;transition:width .2s}
.barrow.win .fl{background:var(--good)}
.barrow .n{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pick{display:grid;gap:8px}
.pick button{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:16px;font-weight:600;text-align:left;padding:0 18px}
.pick button.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.sent{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--good);font-weight:600}
.sent svg{width:20px;height:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cardx{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left}
.cardx small{color:var(--muted);font-size:12px}
.cardx.star{border-color:var(--warn)}
.buzz{width:min(280px,78%);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:-.03em;border:0;cursor:pointer;color:var(--ink-on-color);background:var(--cs);box-shadow:0 12px 0 color-mix(in srgb,var(--cs) 55%,black)}
.buzz.wait{background:var(--surface-2);color:var(--muted);box-shadow:0 12px 0 #000}
.buzz.go{background:var(--bad);box-shadow:0 12px 0 #7a1010}
.rank{display:grid;gap:6px;max-width:420px;margin:0 auto;width:100%}
.rank div{display:flex;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 14px;font-weight:600}
.rank div:first-child{background:color-mix(in srgb,var(--warn) 26%,var(--surface-2))}
.rank em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.light{display:flex;gap:18px;justify-content:center;background:#000;border:1px solid var(--line);border-radius:999px;padding:18px 26px;width:max-content;margin:0 auto;max-width:100%;box-sizing:border-box}
.light i{width:clamp(56px,10vw,96px);aspect-ratio:1;border-radius:50%;background:#1d1d22;transition:.2s}
.light .r.on{background:var(--bad);box-shadow:0 0 40px var(--bad)}
.light .y.on{background:var(--warn);box-shadow:0 0 40px var(--warn)}
.light .g.on{background:var(--good);box-shadow:0 0 40px var(--good)}
input[type=range]{padding:0;min-height:0;height:28px;accent-color:var(--fg);background:none;border:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.team{border-radius:16px;padding:14px;color:var(--ink-on-color)}
.team b{display:block;margin-bottom:6px;font-weight:600}
.team span{display:inline-block;background:rgba(0,0,0,.22);border-radius:999px;padding:2px 9px;margin:2px;font-size:13px}
.omr{display:grid;gap:6px;max-width:440px}
.omr .q{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.omr .q b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.omr button{height:36px;border-radius:999px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.omr button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.omr button.ok{background:var(--good);color:#000;border-color:var(--good)}
.omr button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.omr button.key{border-color:var(--good);color:var(--good)}
.paper{background:#f4f1e8;color:#16130f;border-radius:6px;padding:22px}
.paper .mast{display:flex;justify-content:space-between;align-items:end;border-bottom:3px double #16130f;padding-bottom:8px;margin-bottom:14px;gap:8px}
.paper .mast b{font-size:24px;font-weight:800;letter-spacing:-.05em}
.paper .mast small{font-size:12px}
.paper h5{margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.04em}
.paper .by{font-size:12px;margin-bottom:10px;color:#5a544a}
.paper p{margin:0;columns:2 180px;column-gap:20px;font-size:14px;line-height:1.75}
.desks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.desk{min-height:52px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line);cursor:pointer;font-weight:500;font-size:13px;padding:4px;color:inherit}
.desk.sel,.desk.me{border-color:var(--fg);background:color-mix(in srgb,var(--cs) 35%,var(--surface-2))}
.chalk{background:#173d2b;color:#cfe8d8;border-radius:10px;text-align:center;padding:8px;font-weight:600;font-size:13px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl th{color:var(--muted);font-weight:600;cursor:pointer}
.tbl td{font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.job{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.job b{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.job b em{font-size:12px;font-style:normal;font-weight:500;color:var(--muted)}
.wallet{display:flex;gap:10px;flex-wrap:wrap}
.wallet div{background:var(--surface-2);border-radius:14px;padding:10px 16px}
.wallet small{display:block;color:var(--muted);font-size:12px}
.wallet b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stock{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.stock .p{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.up{color:#ff5b5b} .down{color:#5b8cff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.goods{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;justify-items:start}
.goods .e{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.goods .e svg{width:20px;height:20px}
.order{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.order small{display:block;color:var(--muted)}
.target{font-size:clamp(20px,3vw,28px);font-weight:600;letter-spacing:-.03em;background:var(--surface-2);border-radius:14px;padding:18px;line-height:1.5}
.target .ok{color:var(--good)} .target .no{color:var(--bad);text-decoration:underline}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{background:var(--surface-2);border-radius:12px;padding:8px 14px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{min-height:60px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:16px;font-weight:600;padding:10px}
.opts button.ok{background:var(--good);color:#000;border-color:var(--good)}
.opts button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.prog{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--cs)}
.flip{width:min(420px,100%);aspect-ratio:3/2;margin:0 auto;border-radius:24px;border:0;background:var(--c);color:var(--ink-on-color);font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.04em;cursor:pointer;display:grid;place-items:center;text-align:center;padding:16px}
.flip small{display:block;font-size:14px;font-weight:500;opacity:.8;letter-spacing:0}
.flag{font-size:84px;line-height:1;text-align:center}
.sudo{display:grid;grid-template-columns:repeat(4,1fr);width:min(320px,100%);margin:0 auto;border:2px solid var(--fg);border-radius:10px;overflow:hidden}
.sudo button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface-2);font-size:28px;font-weight:600;cursor:pointer;color:#a98bff}
.sudo button.given{color:var(--fg);background:var(--surface);cursor:default}
.sudo button.bad{background:color-mix(in srgb,var(--bad) 35%,var(--surface-2))}
.sudo button:nth-child(4n+2){border-right:2px solid var(--fg)}
.sudo button:nth-child(n+5):nth-child(-n+8){border-bottom:2px solid var(--fg)}
.gb{background:var(--surface-2);border-radius:16px;padding:16px;display:grid;gap:10px}
.gb .prog{height:10px}
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto;width:100%}
.bingo button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:500;padding:6px;line-height:1.35}
.bingo button.on{background:var(--c);border-color:transparent;color:var(--ink-on-color);font-weight:600}
.quests{display:grid;gap:8px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.quest.done{opacity:.55}
.quest small{color:var(--muted)}
.msgs{display:grid;gap:8px}
.msg{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.msg small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--fg);color:var(--bg)}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface);font-size:12px;font-weight:700;margin-right:6px}

/* 튜토리얼 */
.spot{position:fixed;z-index:50;pointer-events:none;box-shadow:0 0 0 2px var(--fg),0 0 0 9999px var(--shade);transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;animation:glow 1.4s ease-in-out infinite}
.spot.nodim{box-shadow:0 0 0 2px var(--fg);animation:glow2 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,255,255,.28),0 0 0 9999px var(--shade)}}
@keyframes glow2{50%{box-shadow:0 0 0 8px rgba(255,255,255,.28)}}
.dimall{position:fixed;inset:0;z-index:50;background:var(--shade);animation:fade .25s ease both}
.coach{position:fixed;z-index:51;width:min(300px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:16px;padding:16px 18px 12px;box-sizing:border-box;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:rise2 .3s ease both}
@keyframes rise2{from{opacity:0;transform:translateY(8px)}}
.coach .t{font-size:20px;font-weight:700;letter-spacing:-.05em;line-height:1.25;text-wrap:balance}
.coach .s{font-size:13.5px;font-weight:400;color:#4a4a52;margin-top:6px;line-height:1.5}
.coach .f{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;font-weight:600;color:#8a8a96;font-variant-numeric:tabular-nums}
.coach .f button{background:none;border:0;color:#6a6a75;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 0 6px 10px}
.coach.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));padding:28px;text-align:center;animation:none}
.coach.center .t{font-size:clamp(26px,5vw,32px)}
.coach.center .s{font-size:15px}
.coach .go{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.coach .go .btn{border-color:var(--bg)}
.coach .go .btn.dark{background:var(--bg);color:var(--fg)}
.coach .go .btn.lite{background:transparent;color:var(--bg)}
.coach.nudge{animation:nudge .35s ease}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 학급 지갑 · 훈련장 · 학급 설정 */
.wbtn{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.off{background:color-mix(in srgb,var(--bad) 16%,transparent);color:#ff8a8a}
.hubcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:8px}
.hubcard{display:grid;gap:6px;justify-items:start;align-content:start;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:inherit}
.hubcard:hover{border-color:#4a4a55}
.hubcard:disabled{opacity:.45;cursor:default}
.hubcard .sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.hubcard .sq svg{width:20px;height:20px}
.hubcard b{font-weight:600;letter-spacing:-.025em}
.hubcard small{color:var(--muted);font-size:12.5px;line-height:1.4}
.hubcard.did small{color:var(--good)}
.rank2{display:grid;gap:4px;margin-top:8px}
.rank2 div{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--surface)}
.rank2 div.me{outline:1px solid var(--fg)}
.rank2 em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.chk{color:var(--good);font-weight:700}
.tbl.mini th,.tbl.mini td{padding:6px 8px;text-align:center}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:240px;overflow:auto}
.wst{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}
.wst input{width:16px;height:16px;min-height:0;accent-color:var(--fg)}
.wst span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wst b{font-weight:600;font-variant-numeric:tabular-nums}
.wst:has(input:checked){border-color:var(--fg)}
.ledger{display:grid;max-height:240px;overflow:auto}
.ledger div{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.ledger b{font-weight:600}
.ledger .plus{color:var(--good);font-variant-numeric:tabular-nums}
.ledger .minus{color:#ff8a8a;font-variant-numeric:tabular-nums}
.set{display:grid;gap:12px;border:1px solid var(--line);border-radius:16px;padding:16px}
.set-h{display:flex;gap:12px;align-items:flex-start}
.set-h > svg{width:22px;height:22px;margin-top:2px;color:var(--fg-2)}
.set-h b{font-size:16px;font-weight:700;letter-spacing:-.03em}
.set-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6}
.req{font-size:10.5px;font-weight:700;color:var(--bg);background:var(--fg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px}
.radios label:has(input:checked){border-color:var(--fg)}
.radios input{width:16px;height:16px;min-height:0;margin-top:3px;accent-color:var(--fg)}
.radios small{display:block;color:var(--muted);font-size:12.5px}
.periods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.periods div{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.periods input{min-height:38px;padding:6px 8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item .note{grid-column:2;font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.item .note svg{width:14px;height:14px}

#toast{position:fixed;z-index:60;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:12px 18px;border-radius:14px;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .card{padding:20px;border-radius:20px}
  .row2,.two{grid-template-columns:1fr}
  .invite{grid-template-columns:1fr;justify-items:center;text-align:center}
  .logo small,.clschip,.logo .tag{display:none}
  .bar{gap:8px}
  .wbtn{padding:0 11px}
  .btn.store{padding:0 14px}
  .btn.store .lbl-long{display:none}
  .tile{padding:14px 16px;border-radius:22px}
  .tile .cat{left:16px;top:14px}
  .tile .ico{right:14px;top:14px}
  .tile.xl .nm{font-size:27px}
  .tile.lg .nm{font-size:20px}
  .storebox,.toolbox{width:100%;height:100%;max-height:100%;border-radius:0;left:0;top:0;transform:none}
  .storebox.anim,.toolbox.anim{animation:fade .2s ease both}
  .sh,.sl,.sf{padding-left:16px;padding-right:16px}
  .tb{padding:16px}
  .desks{grid-template-columns:repeat(4,minmax(0,1fr))}
  .barrow{grid-template-columns:80px 1fr 36px}
  .opts{grid-template-columns:1fr}
  .bingo{gap:5px}
  .bingo button{font-size:11.5px;padding:3px;border-radius:10px}
  .ox div,.ox button{padding:14px}
  .three{grid-template-columns:1fr}
  .seg{order:3;width:100%}
  .seg button{flex:1;justify-content:center}
}
@media (pointer:coarse){ .btn{min-height:48px} .ctl button{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>


<div id="app"></div>
<div id="layer"></div>
<div id="tour"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>window.SST_WAIT_API = true;</script>
<script>
/* ===== SST Store: 주제 4가지와 메뉴 27개 (아이콘은 Lucide 아이콘 이름) ===== */
const CATS = [
  { id:'lesson', nm:'수업도구' },
  { id:'econ',   nm:'경제학급' },
  { id:'done',   nm:'다했는데 뭐해요?' },
  { id:'mind',   nm:'인성훈련소' },
];
const TOOLS = [
  { id:'ox',       cat:'lesson', ico:'circle-check',        nm:'OX 퀴즈',          ds:'문제를 내면 학생들이 O·X로 답하고, 결과가 바로 모여요.' },
  { id:'mc',       cat:'lesson', ico:'list-checks',         nm:'객관식 질문',      ds:'보기 4개 중에 고르는 질문. 누가 무엇을 골랐는지 막대로 보여 줘요.' },

/* ===== 담은 메뉴로 화면 채우기 =====
   2개면 큰 상자 2개, 3개부터는 크기를 일부러 다르게 해서 각기 다른 크기의 상자로 화면을 나눈다 */
const PAT = [5, 3.1, 2.2, 1.6, 2.7, 1.3, 1.9, 1.15, 1.5, 1.05];
const SIZES = [0.55, 1, 1.7, 2.6];
const sizeIdx = id => (S.size && S.size[id] != null) ? S.size[id] : 1;
function worst(row, side){ const s=row.reduce((a,b)=>a+b.a,0), mx=Math.max(...row.map(r=>r.a)), mn=Math.min(...row.map(r=>r.a)); return Math.max(side*side*mx/(s*s), (s*s)/(side*side*mn)); }
function squarify(items, x, y, w, h){
  const out = []; const total = items.reduce((a,b)=>a+b.v,0); if (!total || w<=0 || h<=0) return out;
  let rest = items.slice().sort((a,b)=>b.v-a.v).map(it=>({ it, a: it.v * (w*h) / total }));
  while (rest.length){
    const side = Math.min(w, h); let row = [rest[0]], i = 1;
    while (i < rest.length && worst(row.concat(rest[i]), side) <= worst(row, side)){ row.push(rest[i]); i++; }
    const sum = row.reduce((a,b)=>a+b.a,0);
    if (w >= h){ const cw = sum/h; let cy = y; row.forEach(r=>{ const ch=r.a/cw; out.push({ ...r.it, x, y:cy, w:cw, h:ch }); cy+=ch; }); x+=cw; w-=cw; }
    else { const ch = sum/w; let cx = x; row.forEach(r=>{ const cw=r.a/ch; out.push({ ...r.it, x:cx, y, w:cw, h:ch }); cx+=cw; }); y+=ch; h-=ch; }
    rest = rest.slice(row.length);
  }
  return out;
}
function drawMap(){
  const map = document.getElementById('map'); if (!map) return;
  const student = map.dataset.mode === 'student';
  const raw = S.installed.map(T).filter(t => t && !(student && t.only));
  const doneN = raw.filter(t => t.cat === 'done').length;
  const list = raw.filter(t => t.cat !== 'done');
  if (doneN) list.splice(Math.min(1, list.length), 0, { ...HUB, ds:`종목 ${doneN}개 · 다 한 친구는 여기서 스스로 연습해요.` });
  const W = map.clientWidth, narrow = W < 560;
  const top = map.getBoundingClientRect().top;
  let H = Math.max(narrow ? 480 : 420, window.innerHeight - top - 20);
  if (narrow) H = Math.max(H, list.length * 120);
  map.style.height = H + 'px';
  const G = 5;   /* 상자 사이 틈의 절반 */
  const items = list.map((t,i) => ({ t, v: (list.length <= 2 ? 1 : PAT[i % PAT.length]) * SIZES[sizeIdx(t.id)] }));
  let html = '';
  squarify(items, 0, 0, W, H).forEach(b => {
    const t = b.t, x = b.x + G, y = b.y + G, w = Math.max(0, b.w - 2*G), h = Math.max(0, b.h - 2*G);
    const s = Math.min(w, h), cls = s >= 260 ? 'xl' : s >= 170 ? 'lg' : s >= 110 ? 'md' : 'sm';
    const is = Math.round(Math.max(20, Math.min(120, s * (cls==='sm' ? .26 : .3))));
    const sw = (24 * Math.max(1.5, Math.min(3, is / 36)) / is).toFixed(2);   /* 큰 아이콘도 선이 가늘게 */
    const showIco = h >= 64 && w >= 64;
    const ctl = !student && UI.edit ? `<div class="ctl">
        <button data-act="size" data-id="${t.id}" data-d="-1" aria-label="작게" ${sizeIdx(t.id)<=0?'disabled':''}>${ic('minus')}</button>
        <button data-act="size" data-id="${t.id}" data-d="1" aria-label="크게" ${sizeIdx(t.id)>=3?'disabled':''}>${ic('plus')}</button>
        ${t.id === 'hub' ? '' : `<button data-act="remove" data-id="${t.id}" aria-label="빼기">${ic('x')}</button>`}</div>` : '';
    html += `<div class="tile ${cls} ${UI.fresh===t.id?'new':''}" role="button" tabindex="0" data-act="${!student && UI.edit ? '' : 'open-tool'}" data-id="${t.id}"
      style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;--c:${cbg(t.cat)}">
      <span class="cat">${esc(C(t.cat).nm)}</span>
      ${showIco ? `<div class="ico" style="--is:${is}px;--sw:${sw}" aria-hidden="true">${ic(t.ico)}</div>` : ''}
      <div class="nm">${esc(t.nm)}</div>${cls==='xl'||cls==='lg' ? `<div class="ds">${esc(t.ds)}</div>` : ''}
      ${t.only && !student && cls!=='sm' ? '<span class="only">선생님만</span>' : ''}${ctl}</div>`;
  });
  map.innerHTML = html;
}

/* ===== 도구 속 기능 (대략 구현) ===== */
const TS = {};          /* 열린 도구의 상태 (교사·학생 화면이 같은 상태를 함께 본다) */
let TIMERS = [];
const every = (f, ms) => { const h = setInterval(f, ms); TIMERS.push(h); return h; };
const later = (f, ms) => { const h = setTimeout(f, ms); TIMERS.push(h); return h; };
function stopTimers(){ TIMERS.forEach(h => { clearInterval(h); clearTimeout(h); }); TIMERS = []; }
const names = () => S.cls.students.map(who);
const meName = () => S.as ? who(S.cls.students.find(s=>s.no===S.as.no) || { no:S.as.no }) : who(S.cls.students[0]);
/* 지금 화면의 학생 계좌 (학급 지갑의 한 칸). 읽기는 W.cash 로, 돈을 바꿀 때는 반드시 move() 로 */
const W = new Proxy({}, { get:(_, k) => acct(meNo())[k], set:(_, k, v) => { acct(meNo())[k] = v; save(); return true; } });
function redrawApp(){ const b = document.getElementById('appbody'); if (b && UI.tool && APPS[UI.tool]) { b.innerHTML = appBody(); icons(); placeTour(); } }
const walletHTML = () => `<div class="wallet"><div><small>${esc(meName())}의 현금</small><b>${won(W.cash)}</b> ${unit()}</div><div><small>예금</small><b>${won(W.saving)}</b> ${unit()}</div></div>`;
const sentHTML = msg => `<div class="sent">${ic('circle-check')}${msg}</div>`;

/* 학생 기록판 (다했는데 뭐해요? 도구들의 교사 화면) */
function makeBoard(unit, lo, hi){ return shuffle(names()).slice(0, 10).map(n => ({ n, v: rnd(lo, hi) })).sort((a,b)=>b.v-a.v).map(r => ({ ...r, unit })); }
const boardHTML = (rows, title) => `<div class="row"><b class="grow">${esc(title)}</b><span class="mute">오늘 참여 ${rows.length + rnd(3,9)}명</span></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>순위</th><th>이름</th><th>기록</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="medal">${i+1}</span></td><td>${esc(r.n)}</td><td>${won(r.v)} ${r.unit}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">학생이 직접 푸는 모습은 위쪽 ‘학생 화면’에서 볼 수 있어요.</p>`;

/* 보기를 고르는 퀴즈 여러 개가 같이 쓰는 틀 */
function quizApp(items, head, board){
  const fresh = () => ({ list: items.map(q => ({ ...q, opts: shuffle(q.opts) })), i:0, score:0, pick:null });
  return {
    init: () => ({ ...fresh(), board: makeBoard('문제', 2, items.length) }),
    t: st => boardHTML(st.board, board),
    s: st => {
      if (st.i >= st.list.length) return `<div class="ap" style="text-align:center"><div class="qbig">${st.score} / ${st.list.length}</div><p class="mute">${st.score === st.list.length ? '모두 맞혔어요. 대단해요!' : '틀린 문제는 다시 풀어 볼까요?'}</p><div class="row c"><button class="btn white" data-a="again">${ic('rotate-ccw')}다시 풀기</button></div></div>`;
      const q = st.list[st.i];
      return `<div class="ap"><div class="prog"><i style="width:${st.i/st.list.length*100}%"></i></div>
        <div class="row"><span class="mute grow">${st.i+1} / ${st.list.length}</span><span class="mute">맞힌 문제 ${st.score}</span></div>
        ${head ? head(q) : ''}<div class="qbig">${esc(q.q)}</div>
        <div class="opts">${q.opts.map(o => `<button data-a="pick" data-v="${esc(o)}" class="${st.pick ? (o===q.a ? 'ok' : (o===st.pick ? 'no' : '')) : ''}" ${st.pick?'disabled':''}>${esc(o)}</button>`).join('')}</div>
        ${st.pick ? `<div class="row c"><b>${st.pick===q.a ? '정답이에요!' : `정답은 ‘${esc(q.a)}’`}</b><button class="btn white" data-a="next">다음${ic('arrow-right')}</button></div>` : ''}</div>`;
    },
    on: {
      pick(st, el){ st.pick = el.dataset.v; if (st.pick === st.list[st.i].a) st.score++; },
      next(st){ st.i++; st.pick = null; if (st.i >= st.list.length) trainDone(); },
      again(st){ Object.assign(st, fresh()); },
    },
  };
}

function mathQ(){ const op = ['+','−','×'][rnd(0,2)]; let a, b, ans;
  if (op === '+'){ a = rnd(12,89); b = rnd(5,59); ans = a + b; } else if (op === '−'){ a = rnd(30,99); b = rnd(5,a-1); ans = a - b; } else { a = rnd(2,9); b = rnd(2,9); ans = a * b; }

function bingoLines(on){ const has = i => on.includes(i); let n = 0;
  for (let r=0;r<4;r++) if ([0,1,2,3].every(c=>has(r*4+c))) n++;

function parseRoster(text, anon, old){
  const out = []; const seen = new Set(); let auto = 0; let err = '';
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line => {
    const m = line.match(/^(\d{1,3})[\s.)\-번]*(.*)$/);
    let no, name;
    if (m){ no = +m[1]; name = m[2].trim(); } else { no = auto + 1; name = line; }
    auto = Math.max(auto, no);
    if (seen.has(no)) err = `${no}번이 두 번 있어요. 번호를 확인해 주세요.`;
    seen.add(no);
    const prev = (old||[]).find(s=>s.no===no);
    out.push({ no, name: anon ? '' : name.slice(0,12), pin: prev ? prev.pin : pin4() });
  });
  out.sort((a,b)=>a.no-b.no);
  return { list: out, err };
}

    if (live()){
      const ids = picks.map(no => (S.cls.students.find(s => s.no === no) || {}).id).filter(Boolean);
      liveCall(() => API.teacherMove(LIVECLS, ids, take ? -amt : amt, memo, 'wallet'), `${picks.length}명${take ? '에게서' : '에게'} ${amt}${unit()}씩 ${take ? '거뒀어요' : '보냈어요'}.`);
      return;
    }
    picks.forEach(no => move(no, take ? -amt : amt, memo));
    toast(`${picks.length}명${take ? '에게서' : '에게'} ${amt}${unit()}씩 ${take ? '거뒀어요' : '보냈어요'}.`);
  }
  if (kind === 'settings'){
    const W0 = S.wallet, T0 = S.train;
    W0.unit = String(d.get('unit') || '').trim().slice(0, 6) || '코인'; W0.start = Math.max(0, +d.get('start') || 0);
    T0.mode = d.get('mode') || 'break'; T0.reward = Math.max(0, +d.get('reward') || 0); T0.dailyMax = Math.max(0, +d.get('dailyMax') || 0); T0.reset = d.get('reset') || 'week';
    T0.periods = T0.periods.map((p, i) => [d.get('pa' + i) || p[0], d.get('pb' + i) || p[1]]);
    if (live()){ UI.modal = null; render(); liveCall(() => API.saveSettings(LIVECLS, settingsOf()), '학급 설정을 저장했어요.'); return; }
    save(); UI.modal = null; toast('학급 설정을 저장했어요.');
  }
  if (kind === 'student'){
    const code = String(d.get('code')||'').trim().toUpperCase(), no = +d.get('no'), pin = String(d.get('pin')||'').trim();
    if (API && !DEMO){
      $('#sErr').textContent = '';
      API.studentLogin(code, no, pin).then(ctx => { UI.modal = null; return openClass(ctx.class_id, 'student', no); })
        .then(() => toast(`${who(S.cls.students.find(s => s.no === no) || { no })}, 어서 와요!`))
        .catch(e2 => { const el = $('#sErr'); if (el) el.textContent = API.errText(e2); });
      return;
    }
    const st = S.cls && S.cls.code === code ? S.cls.students.find(s=>s.no===no) : null;
    if (!S.cls || S.cls.code !== code){ $('#sErr').textContent='반 코드를 다시 확인해 주세요.'; return; }
    if (!st || st.pin !== pin){ $('#sErr').textContent='번호나 비밀번호가 맞지 않아요.'; return; }
    S.as = { no }; UI.modal = null; save(); toast(`${who(st)}, 어서 와요!`);
  }
  render();
  updatePreview();
});

/* 시작: 가이랩 연결 모듈(sst-api.js)이 SST.boot(api)를 부른다. 연결 모듈이 없으면 미리 보기처럼 이 브라우저에만 저장 */
window.SST = {
  async boot(api){
    if (!api){ S = load(); if (S.cls) ensureWallet(); render(); toast('서버에 연결하지 못했어요. 새로고침해 보세요.'); return; }
    API = api; S = blank(); render(); await bootLive();
  },
};
if (window.SST_WAIT_API){ S = blank(); render(); }
else { if (S.cls) ensureWallet(); render(); updatePreview(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawMap(); icons(); placeTour(); });
</script>
<script type="module" src="./sst-api.js"></script>
</body>
</html>
